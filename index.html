<style>

  header{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px clamp(20px,4vw,48px);background:color-mix(in oklch, var(--bg) 86%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);}

  .hero .sub{margin:28px 0 0;font-size:clamp(1.02rem,1.6vw,1.2rem);color:var(--ink-soft);max-width:560px;}
  .cta-primary{display:inline-flex;align-items:center;gap:12px;padding:16px 28px;border:none;cursor:pointer;background:var(--ink);color:var(--bg);font-weight:600;font-size:0.95rem;margin-top:40px;transition:transform .25s ease, opacity .25s ease, background-color .35s ease, color .35s ease;}

  .compare{position:relative;max-width:920px;margin:0 auto;aspect-ratio:1402/1122;overflow:hidden;background:#000;touch-action:pan-y;box-shadow:0 0 0 1px var(--line-soft), 0 30px 60px -30px color-mix(in oklch, var(--m-blue-dark) 40%, transparent);}

  .compare-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;-webkit-appearance:none;appearance:none;}

  .feature-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,4vw,40px);max-width:920px;margin:clamp(32px,5vw,48px) auto 0;}

  .feature-item .tag{font-size:0.72rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;}

  #process{border-top:1px solid var(--line-soft);}

  .step-row .no{font-size:1.6rem;font-weight:600;color:var(--ink-faint);}
  .step-row h3{font-weight:700;font-style:italic;font-size:1.35rem;text-transform:none;color:var(--ink);}
  .step-row p{margin:6px 0 0;font-size:0.96rem;color:var(--ink-soft);}

  #products{border-top:1px solid var(--line-soft);}
  .product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(20px,3vw,32px);}
  @media (max-width:720px){ .product-grid{grid-template-columns:1fr;} }
  .product-frame{overflow:hidden;border:1px solid var(--line-soft);}
  .product-img{width:100%;height:auto;display:block;transition:transform .5s ease;}
  .product-frame:hover .product-img{transform:scale(1.035);}

  #whyus{border-top:1px solid var(--line-soft);background:var(--bg-raised);}

  @media (max-width:980px){ .whyus-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:520px){ .whyus-grid{grid-template-columns:1fr;} }
  .whyus-item{display:flex;flex-direction:column;gap:12px;}
  .whyus-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--m-blue-light);}
  .whyus-item .title{font-size:1rem;font-weight:700;color:var(--ink);}
  .whyus-item .desc{font-size:0.86rem;color:var(--ink-soft);margin:0;}

  #projects{border-top:1px solid var(--line-soft);}
  .project-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,2.4vw,24px);}
  @media (max-width:980px){ .project-grid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:520px){ .project-grid{grid-template-columns:1fr;} }
  .project-card{position:relative;aspect-ratio:4/5;overflow:hidden;border:1px solid var(--line-soft);background:var(--bg-raised);}
  .project-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease;}
  .project-card:hover img{transform:scale(1.05);}
  .project-caption{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(0deg, color-mix(in oklch, var(--bg) 88%, transparent) 0%, transparent 100%);font-size:0.82rem;font-weight:600;}

  #configurator{border-top:1px solid var(--line-soft);background:var(--bg-raised);}
  .config-step{margin-bottom:clamp(32px,5vw,44px);}
  .config-step-label{display:flex;align-items:center;gap:10px;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:16px;}
  .config-step-label .no{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--line);color:var(--ink-soft);font-size:0.7rem;}
  .model-picker{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  .model-pill{border:1px solid var(--line);background:var(--bg);color:var(--ink-soft);padding:10px 18px;cursor:pointer;font-size:0.86rem;font-weight:600;}
  .model-pill.selected{border-color:var(--m-blue-light);color:var(--ink);background:color-mix(in oklch, var(--m-blue-light) 10%, var(--bg));}

  @media (max-width:720px){ .vehicle-fields{grid-template-columns:1fr;} }
  .field{display:flex;flex-direction:column;gap:8px;min-width:0;}
  .field-label{font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-faint);}
  .field-input{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:12px 14px;font-family:inherit;font-size:0.92rem;border-radius:0;width:100%;}

  .scope-grid{display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);}
  @media (max-width:720px){ .scope-grid{grid-template-columns:1fr;} }
  .scope-card{position:relative;text-align:left;cursor:pointer;background:var(--bg);border:none;padding:28px 24px 32px;display:flex;flex-direction:column;gap:12px;min-height:200px;width:100%;transition:background-color .35s ease, color .35s ease;}
  .scope-corner{position:absolute;top:14px;right:14px;transition:opacity .3s ease;opacity:0;}
  .scope-card.selected .scope-corner{opacity:1;}
  .scope-tag{font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-faint);}
  .scope-title{font-weight:700;font-style:italic;font-size:1.25rem;text-transform:uppercase;font-family:'Big Shoulders Display',sans-serif;color:var(--ink);}
  .scope-desc{font-size:0.88rem;color:var(--ink-soft);flex-grow:1;}
  .scope-label{font-size:0.72rem;letter-spacing:0.04em;color:var(--ink-faint);}
  .scope-card.selected .scope-label{color:var(--m-blue-light);}
  .request-actions{margin-top:1px;background:var(--bg);border:1px solid var(--line-soft);border-top:none;padding:clamp(28px,4vw,40px);}
  .request-actions p{margin:0;font-size:0.92rem;color:var(--ink-soft);max-width:640px;}
  .request-actions-row{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:20px;}
  .email-toggle{font-size:0.86rem;color:var(--ink-faint);text-decoration:underline;cursor:pointer;background:none;border:none;padding:0;}
  .email-toggle:hover{color:var(--m-blue-light);}
  .email-form{display:none;margin-top:28px;padding-top:28px;border-top:1px solid var(--line-soft);}
  .email-form.open{display:block;}
  .hp-field{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}

  .whatsapp-float{position:fixed;right:20px;bottom:20px;z-index:50;width:56px;height:56px;border-radius:50%;background:var(--whatsapp);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -6px rgba(0,0,0,0.4);transition:transform .25s ease;}
  .whatsapp-float:hover{transform:scale(1.07);}

  footer{padding:clamp(40px,6vw,64px) clamp(20px,4vw,48px) clamp(32px,4vw,40px);border-top:1px solid var(--line-soft);}
  .footer-inner{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:32px;}
  .footer-top{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap;}
  .footer-brand{max-width:320px;display:flex;flex-direction:column;gap:14px;}
  .footer-brand p{margin:0;font-size:0.88rem;color:var(--ink-soft);}
  .footer-nav{display:flex;flex-direction:column;gap:10px;}
  .footer-nav-title{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-faint);}
  .footer-nav button{text-align:left;font-size:0.92rem;color:var(--ink-soft);}
  .footer-contact-row{display:flex;align-items:center;gap:8px;font-size:0.92rem;color:var(--ink-soft);}
  .footer-bottom{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:24px;border-top:1px solid var(--line-soft);}
  .footer-bottom .mono{font-size:0.72rem;color:var(--ink-faint);}
</style>
</head>

function get(obj, path) {
  return path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
}

const WHATSAPP_NUMBER = "905528082002";

// --- EmailJS config: fill in after setting up your account at emailjs.com ---
const EMAILJS_PUBLIC_KEY = "REPLACE_WITH_PUBLIC_KEY";
const EMAILJS_SERVICE_ID = "REPLACE_WITH_SERVICE_ID";
const EMAILJS_TEMPLATE_BUSINESS = "REPLACE_WITH_BUSINESS_TEMPLATE_ID";
const EMAILJS_TEMPLATE_CUSTOMER = "REPLACE_WITH_CUSTOMER_TEMPLATE_ID";
const BUSINESS_NOTIFY_EMAILS = "REPLACE_WITH_MUSTAFA_EMAIL,REPLACE_WITH_SEMIH_EMAIL";
if (typeof emailjs !== "undefined" && !EMAILJS_PUBLIC_KEY.startsWith("REPLACE")) {
  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });
}

const state = { lang: "tr", scope: "ext", model: "BMW F10" };

// --- theme ---
const THEME_KEY = "reborn-theme";
function applyTheme(theme) {
  if (theme === "light") document.documentElement.setAttribute("data-theme", "light");
  else document.documentElement.removeAttribute("data-theme");
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}
document.getElementById("themeToggle").addEventListener("click", () => {
  const isLight = document.documentElement.getAttribute("data-theme") === "light";
  applyTheme(isLight ? "dark" : "light");
});

// --- whatsapp links ---
function setWhatsappLinks() {
  const generic = `https://wa.me/${WHATSAPP_NUMBER}`;
  document.getElementById("headerWhatsapp").href = generic;
  document.getElementById("footerWhatsapp").href = generic;
  document.getElementById("floatWhatsapp").href = generic;
}

function updateConfiguratorWhatsapp() {
  const T = COPY[state.lang];
  const otherInput = document.getElementById("vehicleModelOther");
  const model = state.model === "other" ? (otherInput.value.trim() || T.config.modelOther) : state.model;
  const scopeCard = document.querySelector(".scope-card.selected");
  const scopeLabel = scopeCard ? scopeCard.querySelector(".scope-title").textContent : "";
  let msg = T.config.whatsappMsg.replace("{model}", model).replace("{scope}", scopeLabel);
  const currentYear = document.getElementById("currentYear").value;
  const targetYear = document.getElementById("targetYear").value;
  if (currentYear || targetYear) {
    msg += ` (${T.config.currentYearLabel}: ${currentYear || "-"}, ${T.config.targetYearLabel}: ${targetYear || "-"})`;
  }
  document.getElementById("whatsappCta").href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}

function renderStaticText() {
  const T = COPY[state.lang];
  document.documentElement.lang = state.lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    const val = get(T, el.getAttribute("data-i18n"));
    if (typeof val === "string") el.textContent = val;
  });
  document.querySelectorAll(".lang-btn").forEach((btn) => {
    btn.setAttribute("aria-pressed", String(btn.dataset.lang === state.lang));
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => {
    el.placeholder = get(T, el.getAttribute("data-i18n-placeholder"));
  });

  const stepsList = document.getElementById("stepsList");
  stepsList.innerHTML = "";
  T.steps.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "step-row";
    row.innerHTML = `<span class="mono no">${String(i + 1).padStart(2, "0")}</span>
      <div><h3>${s.title}</h3><p>${s.desc}</p></div>`;
    stepsList.appendChild(row);
  });

  const whyusGrid = document.getElementById("whyusGrid");
  whyusGrid.innerHTML = "";
  const icons = [
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 17l6-11 6 11M7 12h6"/><circle cx="18" cy="17" r="3"/></svg>',
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 3l7 7-11 11H3v-7L14 3Z"/></svg>',
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h18M3 12a9 9 0 0 1 9-9M3 12a9 9 0 0 0 9 9M12 3a9 9 0 0 1 0 18"/></svg>',
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>',
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 21s-7-4.6-9.5-9A5.5 5.5 0 0 1 12 6a5.5 5.5 0 0 1 9.5 6c-2.5 4.4-9.5 9-9.5 9Z"/></svg>',
  ];
  T.whyus.items.forEach((item, i) => {
    const el = document.createElement("div");
    el.className = "whyus-item";
    el.innerHTML = `<div class="whyus-icon">${icons[i] || ""}</div><p class="title">${item.title}</p><p class="desc">${item.desc}</p>`;
    whyusGrid.appendChild(el);
  });

  renderScope();
  updateConfiguratorWhatsapp();
}

function renderScope() {
  const T = COPY[state.lang];
  document.querySelectorAll(".scope-card").forEach((card) => {
    const selected = card.dataset.scope === state.scope;
    card.classList.toggle("selected", selected);
    card.querySelector("[data-scope-label]").textContent = selected ? T.selected : T.select;
  });
}

document.querySelectorAll(".lang-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.lang = btn.dataset.lang;
    renderStaticText();
  });
});

function populateYears() {
  const currentYearNow = new Date().getFullYear();
  const startYear = 1990;
  ["currentYear", "targetYear"].forEach((id) => {
    const select = document.getElementById(id);
    for (let y = currentYearNow; y >= startYear; y--) {
      const opt = document.createElement("option");
      opt.value = String(y);
      opt.textContent = String(y);
      select.appendChild(opt);
    }
  });
}
populateYears();
document.getElementById("currentYear").addEventListener("change", updateConfiguratorWhatsapp);
document.getElementById("targetYear").addEventListener("change", updateConfiguratorWhatsapp);

const compareRange = document.getElementById("compareRange");
const compareBeforeWrap = document.getElementById("compareBeforeWrap");
const compareDivider = document.getElementById("compareDivider");
const compareHandle = document.querySelector(".compare-handle");

function updateCompare(val) {
  compareBeforeWrap.style.clipPath = `inset(0 ${100 - val}% 0 0)`;
  compareDivider.style.left = val + "%";
  compareHandle.style.left = val + "%";
}

compareRange.addEventListener("input", () => updateCompare(compareRange.value));
updateCompare(50);

document.querySelectorAll(".scope-card").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.scope = btn.dataset.scope;
    renderScope();
    updateConfiguratorWhatsapp();
  });
});

document.querySelectorAll(".model-pill").forEach((btn) => {
  btn.addEventListener("click", () => {
    state.model = btn.dataset.model;
    document.querySelectorAll(".model-pill").forEach((b) => b.classList.toggle("selected", b === btn));
    document.getElementById("vehicleModelOther").style.display = state.model === "other" ? "block" : "none";
    updateConfiguratorWhatsapp();
  });
});
document.getElementById("vehicleModelOther").addEventListener("input", updateConfiguratorWhatsapp);

document.querySelectorAll("[data-scroll]").forEach((btn) => {
  btn.addEventListener("click", () => {
    const el = document.getElementById(btn.dataset.scroll);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  });
});
document.querySelectorAll("[data-scroll-top]").forEach((btn) => {
  btn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
});

document.getElementById("emailToggle").addEventListener("click", () => {
  document.getElementById("emailForm").classList.toggle("open");
});

const submitBtn = document.getElementById("submitRequest");
const statusEl = document.getElementById("requestStatus");
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

function setStatus(text, kind) {
  statusEl.textContent = text;
  statusEl.className = "request-status" + (kind ? " " + kind : "");
}

submitBtn.addEventListener("click", async () => {
  const T = COPY[state.lang];

  if (document.getElementById("custWebsite").value) {
    return;
  }

  const name = document.getElementById("custName").value.trim();
  const phone = document.getElementById("custPhone").value.trim();
  const email = document.getElementById("custEmail").value.trim();
  const otherInput = document.getElementById("vehicleModelOther");
  const vehicle = state.model === "other" ? otherInput.value.trim() : state.model;
  const currentYear = document.getElementById("currentYear").value;
  const targetYear = document.getElementById("targetYear").value;

  if (!name || !phone || !email || !vehicle) {
    setStatus(T.config.errorFields, "error");
    return;
  }
  if (!EMAIL_RE.test(email)) {
    setStatus(T.config.errorEmail, "error");
    return;
  }
  if (EMAILJS_PUBLIC_KEY.startsWith("REPLACE")) {
    setStatus("E-Mail-Versand noch nicht eingerichtet (EmailJS-Konfiguration fehlt).", "error");
    return;
  }

  const scopeCard = document.querySelector(".scope-card.selected");
  const scopeLabel = scopeCard ? scopeCard.querySelector(".scope-title").textContent : "";

  const params = {
    customer_name: name,
    customer_phone: phone,
    customer_email: email,
    vehicle_model: vehicle,
    current_year: currentYear,
    target_year: targetYear,
    scope: scopeLabel,
    to_email: BUSINESS_NOTIFY_EMAILS,
  };

  submitBtn.disabled = true;
  setStatus(T.config.sending, "sending");

  try {
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_BUSINESS, params);
    await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_CUSTOMER, params);
    setStatus(T.config.success, "success");
  } catch (err) {
    setStatus(T.config.errorSend, "error");
  } finally {
    submitBtn.disabled = false;
  }
});

// --- scroll reveal ---
const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    if (entry.isIntersecting) {
      entry.target.classList.add("visible");
      revealObserver.unobserve(entry.target);
    }
  });
}, { threshold: 0.12 });
document.querySelectorAll(".reveal").forEach((el) => revealObserver.observe(el));

setWhatsappLinks();
renderStaticText();
</script>
</body>
